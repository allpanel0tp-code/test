<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d3e">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<title>চ্যানেল</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14292a;--mute:#5d7273;--head:#0f3d3e;--acc:#f2a900;--line:#d5dfde;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a1a;--card:#16282a;--ink:#e6efee;--mute:#8fa6a6;--head:#0a2a2b;--line:#27403f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.15rem;margin:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:none;border:0;color:#fff;font:inherit;font-size:1.3rem;padding:4px 8px}
main{flex:1;overflow-y:auto;padding:12px 12px 90px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#222}
.ch{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.av{width:46px;height:46px;border-radius:50%;background:var(--head);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.ch .t{flex:1;min-width:0}
.ch b{display:block}
.ch small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;border-radius:18px;padding:7px 14px;font:inherit;font-weight:600;background:var(--acc);color:#222}
.btn.out{background:none;border:1px solid var(--line);color:var(--ink)}
.post{background:var(--card);border-radius:4px 16px 16px 16px;padding:8px;margin-bottom:10px;max-width:92%;border:1px solid var(--line)}
.post img{width:100%;border-radius:10px;display:block;margin-bottom:6px}
.post p{margin:4px 6px;white-space:pre-wrap;word-break:break-word}
.post a{color:#1a73e8;word-break:break-all}
@media(prefers-color-scheme:dark){.post a{color:#7fb2ff}}
.post time{display:block;text-align:right;font-size:.72rem;color:var(--mute);margin:2px 6px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#222;font-size:1.8rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.comp{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font:inherit;background:var(--bg);color:var(--ink);resize:none;max-height:120px}
.comp label{font-size:1.5rem;padding:4px 6px}
#prev{display:none;padding:6px 10px;background:var(--card)}
#prev img{height:70px;border-radius:8px}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,380px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input,dialog textarea{width:100%;margin:6px 0 12px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--mute);margin-top:40px}
#notifbar{background:var(--acc);color:#222;padding:8px 12px;display:none;justify-content:space-between;align-items:center;font-size:.9rem}
</style>
</head>
<body>
<header><button id="back" style="display:none">←</button><h1 id="title">চ্যানেল</h1><button id="mine" style="display:none" title="চ্যানেল ছাড়ুন"></button></header>
<div id="notifbar"><span>নতুন পোস্টের নোটিফিকেশন চান?</span><button class="btn" id="allow">চালু করুন</button></div>
<main id="main"><p class="empty">লোড হচ্ছে… (সংস্করণ ৯)</p></main>
<div id="prev"><img id="pimg" alt=""></div>
<div class="comp" id="comp" style="display:none">
  <label for="file">📷</label><input type="file" id="file" accept="image/*" hidden>
  <textarea id="txt" rows="1" placeholder="নতুন পোস্ট লিখুন…"></textarea>
  <button class="btn" id="send">পাঠান</button>
</div>
<button class="fab" id="fab">+</button>

<dialog id="dlg">
  <b>নতুন চ্যানেল</b>
  <input id="cname" placeholder="চ্যানেলের নাম" maxlength="40">
  <textarea id="cdesc" rows="2" placeholder="বিবরণ (ঐচ্ছিক)" maxlength="120"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn out" id="cancel">বাতিল</button><button class="btn" id="make">তৈরি করুন</button></div>
</dialog>

<script>
const KEY = "AIzaSyBcIndoIA5ZAyA-7ykefcyFM8kPqOcQfL4", PROJ = "test-efd19";
const ROOT = 'projects/' + PROJ + '/databases/(default)/documents';
const DB = 'https://firestore.googleapis.com/v1/' + ROOT;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

const $ = s => document.querySelector(s);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, u => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>');
const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let uid, token, exp = 0, joined = [], tab = 'all', cur = null, chans = [], imgData = null, ready = false, postSig = null, postTimer = null;

async function http(url, opt = {}, ms = 12000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { ...opt, signal: c.signal });
    let j = await r.json().catch(() => ({}));
    const er = Array.isArray(j) ? (j[0] || {}) : j;
    if (!r.ok || er.error) { const e = new Error((er.error && er.error.message) || ('HTTP ' + r.status)); e.status = (er.error && er.error.code) || r.status; throw e; }
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('সময় শেষ: সার্ভার সাড়া দিচ্ছে না');
    throw e;
  } finally { clearTimeout(t); }
}

function setAuth(id, tok, ref, secs) { uid = id; token = tok; exp = Date.now() + (+secs - 60) * 1000; ls.set('auth', { uid: id, ref }); }

async function refresh() {
  const a = ls.get('auth');
  if (a && a.ref) {
    try {
      const j = await http('https://securetoken.googleapis.com/v1/token?key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.ref) });
      setAuth(j.user_id, j.id_token, j.refresh_token, j.expires_in);
      return;
    } catch (e) {}
  }
  const j = await http('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) });
  setAuth(j.localId, j.idToken, j.refreshToken, j.expiresIn);
}

async function api(path, opt = {}) {
  if (!token || Date.now() > exp) await refresh();
  const url = DB + path;
  const o = { ...opt, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } };
  try { return await http(url, o); }
  catch (e) { if (e.status === 401) { await refresh(); o.headers.Authorization = 'Bearer ' + token; return http(url, o); } throw e; }
}

const S = v => ({ stringValue: String(v) });
function parse(doc) {
  const o = { id: doc.name.split('/').pop() };
  for (const k in (doc.fields || {})) {
    const v = doc.fields[k];
    o[k] = 'stringValue' in v ? v.stringValue : 'integerValue' in v ? +v.integerValue : 'timestampValue' in v ? new Date(v.timestampValue) : 'arrayValue' in v ? (v.arrayValue.values || []).map(x => x.stringValue) : null;
  }
  return o;
}
async function query(parent, q) {
  const r = await api(parent + ':runQuery', { method: 'POST', body: JSON.stringify({ structuredQuery: q }) });
  return r.filter(x => x.document).map(x => parse(x.document));
}
const byTime = (col, n) => ({ from: [{ collectionId: col }], orderBy: [{ field: { fieldPath: 't' }, direction: 'DESCENDING' }], limit: n });

function fail(e) {
  $('#main').innerHTML = '<p class="empty">সংযোগ হয়নি: ' + esc(e.message) + '<br><br><button class="btn" id="retry">আবার চেষ্টা করুন</button></p>';
  $('#retry').onclick = boot;
}

async function loadChannels() {
  try {
    try { joined = parse(await api('/users/' + uid)).joined || []; } catch (e) { if (e.status !== 404) throw e; joined = []; }
    chans = await query('', byTime('channels', 100));
    ready = true;
    if (!cur) render();
  } catch (e) { if (!ready) fail(e); }
}

async function boot() {
  $('#main').innerHTML = '<p class="empty">লোড হচ্ছে… (সংস্করণ ৯)</p>';
  try { await refresh(); } catch (e) { fail(e); return; }
  loadChannels();
}
boot();
setInterval(() => { if (!cur && ready) loadChannels(); }, 15000);
setInterval(checkNew, 20000);
if ('Notification' in window && Notification.permission === 'default') $('#notifbar').style.display = 'flex';
$('#allow').onclick = async () => { await Notification.requestPermission(); $('#notifbar').style.display = 'none'; };

async function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const reg = await navigator.serviceWorker.ready;
  reg.showNotification(title, { body, icon: 'launchericon-192x192.png' });
}

async function checkNew() {
  if (!ready) return;
  const seen = ls.get('seen') || {};
  for (const id of joined.slice(0, 10)) {
    try {
      const p = (await query('/channels/' + id, byTime('posts', 1)))[0];
      if (!(id in seen)) { seen[id] = p ? p.id : ''; continue; }
      if (p && seen[id] !== p.id) {
        seen[id] = p.id;
        const viewing = cur && cur.id === id && !document.hidden;
        if (p.by !== uid && !viewing) { const c = chans.find(x => x.id === id); notify(c ? c.name : 'চ্যানেল', p.text || '📷 নতুন ছবি'); }
      }
    } catch (e) {}
  }
  ls.set('seen', seen);
}

function render() {
  if (cur) return;
  $('#title').textContent = 'চ্যানেল';
  $('#back').style.display = 'none';
  $('#mine').style.display = 'none';
  $('#fab').style.display = 'block';
  $('#comp').style.display = 'none';
  const list = chans.filter(c => tab === 'all' || joined.includes(c.id));
  $('#main').innerHTML =
    '<div class="tabs"><button data-t="all" class="' + (tab === 'all' ? 'on' : '') + '">সব চ্যানেল</button>' +
    '<button data-t="my" class="' + (tab === 'my' ? 'on' : '') + '">আমার চ্যানেল</button></div>' +
    (list.length ? list.map(c =>
      '<div class="ch" data-id="' + c.id + '"><div class="av">' + esc((c.name || '#')[0]) + '</div>' +
      '<div class="t"><b>' + esc(c.name) + '</b><small>' + (c.count || 0) + ' সদস্য' + (c.desc ? ' – ' + esc(c.desc) : '') + '</small></div>' +
      '<button class="btn ' + (joined.includes(c.id) ? 'out' : '') + '" data-j="' + c.id + '">' + (joined.includes(c.id) ? 'জয়েন করা' : 'জয়েন') + '</button></div>'
    ).join('') : '<p class="empty">' + (tab === 'my' ? 'এখনো কোনো চ্যানেলে জয়েন করেননি।' : 'কোনো চ্যানেল নেই। + চেপে প্রথমটি বানান।') + '</p>');
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  document.querySelectorAll('.ch').forEach(el => el.onclick = e => {
    if (e.target.dataset.j) { toggle(e.target.dataset.j); return; }
    open(el.dataset.id);
  });
}

async function saveJoined() {
  await api('/users/' + uid + '?updateMask.fieldPaths=joined', { method: 'PATCH', body: JSON.stringify({ fields: { joined: { arrayValue: { values: joined.map(S) } } } }) });
}

async function toggle(id) {
  const on = joined.includes(id);
  try {
    joined = on ? joined.filter(x => x !== id) : [...joined, id];
    render();
    await saveJoined();
    await api(':commit', { method: 'POST', body: JSON.stringify({ writes: [{ transform: { document: ROOT + '/channels/' + id, fieldTransforms: [{ fieldPath: 'count', increment: { integerValue: on ? '-1' : '1' } }] } }] }) });
    loadChannels();
  } catch (e) { alert('হয়নি: ' + e.message); loadChannels(); }
}

function renderPosts(ps) {
  $('#main').innerHTML = ps.length ? ps.map(p =>
    '<div class="post">' + (p.img ? '<img src="' + p.img + '" alt="">' : '') + (p.text ? '<p>' + linkify(p.text) + '</p>' : '') +
    '<time>' + (p.t ? p.t.toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' }) : '') + '</time></div>').join('')
    : '<p class="empty">এখনো কোনো পোস্ট নেই।</p>';
}

async function pollPosts() {
  if (!cur) return;
  const id = cur.id;
  try {
    const ps = await query('/channels/' + id, byTime('posts', 60));
    if (!cur || cur.id !== id) return;
    const sig = ps.map(p => p.id).join(',');
    if (sig !== postSig) {
      postSig = sig; renderPosts(ps);
      const seen = ls.get('seen') || {}; seen[id] = ps[0] ? ps[0].id : ''; ls.set('seen', seen);
    }
  } catch (e) { if (postSig === null) $('#main').innerHTML = '<p class="empty">পোস্ট লোড হয়নি: ' + esc(e.message) + '</p>'; }
}

function open(id) {
  cur = chans.find(c => c.id === id);
  if (!cur) return;
  postSig = null;
  $('#title').textContent = cur.name;
  $('#back').style.display = 'block';
  $('#fab').style.display = 'none';
  $('#comp').style.display = cur.owner === uid ? 'flex' : 'none';
  $('#main').innerHTML = '<p class="empty">লোড হচ্ছে…</p>';
  pollPosts();
  clearInterval(postTimer);
  postTimer = setInterval(pollPosts, 5000);
}

$('#back').onclick = () => { clearInterval(postTimer); cur = null; clearImg(); render(); };
$('#fab').onclick = () => $('#dlg').showModal();
$('#cancel').onclick = () => $('#dlg').close();
$('#make').onclick = async () => {
  const name = $('#cname').value.trim();
  if (!name) return;
  try {
    const d = await api('/channels', { method: 'POST', body: JSON.stringify({ fields: { name: S(name), desc: S($('#cdesc').value.trim()), owner: S(uid), count: { integerValue: '1' }, t: { timestampValue: new Date().toISOString() } } }) });
    joined = [...joined, d.name.split('/').pop()];
    await saveJoined();
    $('#cname').value = ''; $('#cdesc').value = '';
    $('#dlg').close();
    loadChannels();
  } catch (e) { alert('চ্যানেল হয়নি: ' + e.message); }
};

function clearImg() { imgData = null; $('#prev').style.display = 'none'; $('#file').value = ''; }
$('#file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const im = new Image();
  im.onload = () => {
    const r = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = im.width * r; c.height = im.height * r;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    imgData = c.toDataURL('image/jpeg', 0.7);
    $('#pimg').src = imgData; $('#prev').style.display = 'block';
  };
  im.src = URL.createObjectURL(f);
};

$('#send').onclick = async () => {
  const text = $('#txt').value.trim();
  if (!text && !imgData) return;
  $('#send').disabled = true;
  try {
    await api('/channels/' + cur.id + '/posts', { method: 'POST', body: JSON.stringify({ fields: { text: S(text), img: S(imgData || ''), by: S(uid), t: { timestampValue: new Date().toISOString() } } }) });
    $('#txt').value = ''; clearImg();
    pollPosts();
  } catch (e) { alert('পোস্ট হয়নি: ' + e.message); }
  $('#send').disabled = false;
};
</script>
</body>
</html>
